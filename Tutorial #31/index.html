<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeWithSethiji - CSS Media Queries</title>
    <style>

        
        *{
            margin: 0;
            padding: 0;
        }
        .boxes{
            background-color: green;
            height: 100vh;
            width: 100vw;
            display: flex;
        }
        .box{
            background-color: greenyellow;
            height: 100px;
            width: 100px;
            margin: 10px;
        }

        @media only screen and (max-width:700px){
            .boxes{
                background-color: darkgreen;
                flex-direction: column;
            }
            .box{
                background-color: lightgreen;
            }
        }

        @media only screen and (min-width:1000px){
            .boxes{
                background-color: black;
            }
        }

        </style>
</head>
<body>
    <div class="boxes">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
