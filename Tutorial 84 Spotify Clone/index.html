<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="utility.css">
    <title>Spotify Clone</title>
</head>

<body>

    <!--------------------- LEFT --------------------------->
    <div class="container flex bg-black">
        <div class="left">

            <div class="home bg-gray rounded p-3">
                <div class="logo"><img class="invert" src="svg/logo.svg" alt="logo"></div>
                <ul>
                    <li><img class="invert" src="svg/home.svg" alt="home">Home</li>
                    <li><img class="invert" src="svg/search.svg" alt="search">Search</li>
                </ul>
            </div>

            <div class="library bg-gray rounded p-2">
                <div class="heading">
                    <div class="heading-left cp">
                        <img src="svg/playlist.svg" class="invert" alt="">
                        <h1>Your Library</h1>
                    </div>
                    <div class="heading-right cp">
                        <img src="svg/plus.svg" class="invert" alt="">
                    </div>
                </div>

                <div class="footar">
                    <div class="footar-box-1 py-1">
                        <div>
                            <a href="" id="">
                                <span>Legal</span>
                            </a>
                        </div>
                        <div>
                            <a href="" id="">
                                <span>Safety &amp; Privacy Center</span>
                            </a>
                        </div>
                        <div>
                            <a href="" id="">
                                <span>Privacy Policy</span>
                            </a>
                        </div>
                        <div>
                            <a href="" id="">
                                <span>Cookies</span>
                            </a>
                        </div>
                        <div>
                            <a href="" id="">
                                <span>About Ads</span>
                            </a>
                        </div>
                        <div>
                            <a href="" id="">
                                <span>Accessibility</span>
                            </a>
                        </div>
                    </div>
                    <div class="footar-box-2 py-1">
                        <a href="" id="">
                            <span>Cookies</span>
                        </a>
                    </div>
                    <div class="footar-box-3">
                        <img src="svg/univers.svg" class="invert" alt="">
                        <span>English</span>
                    </div>

                </div>
            </div>

        </div>

        <!---------------------- RIGHT ---------------------->
        <div class="right">
            <div class="right-main flex rounded bg-gray">
                <div class="right-nav rounded">
                    <div class="right-head-left">
                        <div>
                            <span class="arr-btn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24"
                                    height="24" color="#000000" fill="none" class="invert">
                                    <path d="M15 6C15 6 9.00001 10.4189 9 12C8.99999 13.5812 15 18 15 18"
                                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg></span>
                            <span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24"
                                    color="#000000" fill="none" class="invert">
                                    <path d="M9.00005 6C9.00005 6 15 10.4189 15 12C15 13.5812 9 18 9 18"
                                        stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                        stroke-linejoin="round" />
                                </svg></span>
                        </div>
                    </div>
                    <div class="right-head-right">
                        <button class="signup-btn">Sing up</button>
                        <button class="login-btn">Log in</button>
                    </div>
                </div>
                <div class="spotifyPlaylist">
                    <h1>Spotify Playlist</h1>
                    <div class="card-container">
                        <div class="card">
                            <img src="images/card-img-2.jpg" alt="">
                            <h2>Sajni (From "Laapataa Ladies")</h2>
                            <p>Ram Sampath, Arijit Singh, Prashant Pandey, Raghav Sethi</p>
                        </div>
                    </div>
                </div>
                
            </div>
        </div>
    </div>
</body>

</html>
