<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeWithSethiji - CSS Project Exercise - 3</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Baloo+Bhai+2&family=Dancing+Script&family=Lobster&family=Lora&family=Nunito&family=Poppins&family=Roboto&family=Rubik&family=Ubuntu&display=swap');
        body{
            font-family: 'Poppins', sans-serif;
            background-color: rgba(255, 0, 106, 0.253);
        }
         .box{
            height: 450px;
            width: 270px;
            border: 2px solid black;
            border-radius: 10px;
            margin: 70px auto; 
            background-color: rgba(255, 0, 106, 0.521);
         }
         .box img{
            height: 200px;
            width: 250px;
            margin: 10px;
            border-radius: 10px;
            box-shadow: 1px 1px 10px 3px rgba(255, 0, 106, 0.521);
         }
         .box span{
            margin: 10px;
            font-weight: 900;
            font-size: 20px;
            cursor: pointer;
         }
         .box p{
            margin: 10px;
            font-size: 20px;
         }
         .btn{
            font-size: 20px;
            text-align: center;
            border-radius: 10px;
            font-weight: 900;
            text-shadow: 2px 3px 4px rgba(255, 0, 106, 0.521);
            margin: 20px 0px;
            cursor: pointer;
         }

    </style>
</head>
<body>
    <div class="box">
        <img src="image.jpg" alt="">
        <span>Nature</span>
        <span>Lake</span>
        <p>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Libero, ducimus?</p>
        <div class="btn">Read More</div>
    </div>
</body>
</html>
