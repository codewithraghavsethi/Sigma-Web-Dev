<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeWithSethiji - CSS Position Property Absolute</title>
  </head>
  <style>
    .parent {
      width: 80vw;
      border: 5px solid red;
      margin-top: 100px;
      /* position: static;               don't work because this is a default value*/
      position: relative;
      /* position: absolute;             yes */
      /* position: fixed;                yes */
      /* position: sticky;               yes */
      /* transform: ;                    yes */
      /* perspective: ;                  yes */
      /* filter: ;                       yes */
    }
    .box {
      border: 2px solid black;
      height: 150px;
      width: 500px;
      margin: 5px;
      padding: 5px;
    }
    .box-1 {
      background-color: rgba(139, 0, 0, 0.63);
    }
    .box-2 {
      background-color: rgba(0, 128, 0, 0.582);
      position: absolute;
      top: 10px;
    }
    .box-3 {
      background-color: rgba(255, 0, 0, 0.753);
    }
    .box-4 {
      background-color: rgba(137, 43, 226, 0.582);
    }
    .box-5 {
      background-color: rgba(32, 178, 171, 0.61);
    }
  </style>
  <body>
    <div class="parent">
      <div class="box box-1"></div>
      <div class="box box-2"></div>
      <div class="box box-3"></div>
      <div class="box box-4"></div>
      <div class="box box-5"></div>
    </div>
  </body>
</html>
